services:
  # FastAPI Backend Web Service
  - type: web
    name: mymonitorxx-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: mymonitorxx
      - key: FIREBASE_PROJECT_ID
        value: moniterxx
      - key: ENVIRONMENT
        value: production
      - key: DEV_MODE
        value: false
      - key: CORS_ORIGINS
        value: "https://canvaonly322.github.io,http://localhost:3000,http://localhost:5500"
